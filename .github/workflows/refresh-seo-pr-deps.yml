name: Refresh SEO PR dependency lockfile

on:
  pull_request:
    types: [synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/seo-indexacion-ux-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/seo-indexacion-ux-2026
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update vulnerable dependencies and lockfile
        run: |
          npm install next@16.4.1 --save-exact
          npm audit fix
          npm audit --audit-level=moderate
      - name: Commit dependency changes to feature branch only
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(deps): patch audited Next.js and source-map-js vulnerabilities"
            git push origin HEAD:feat/seo-indexacion-ux-2026
          fi
